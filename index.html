    />
    <!--
      图标直接内联成 data URI，不引外部 favicon.svg。

      原因：整个站点是单文件构建（见 vite.config.js），产物只有 index.html 一个文件。
      如果这里还指向外部文件，用 file:// 双击打开时图标必然加载失败，
      控制台会多一条没有意义的报错。内联之后产物真正零外部请求。

      改动图标时重新生成 base64：
        node -e "console.log('data:image/svg+xml;base64,'+require('fs').readFileSync('public/favicon.svg').toString('base64'))"
    -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+IDxyZWN0IHdpZHRoPSIzMiIgaGVpZ2h0PSIzMiIgcng9IjciIGZpbGw9IiMwOTY5ZGEiLz4gPHBhdGggZD0iTTEyLjUgOS41IDggMTZsNC41IDYuNU0xOS41IDkuNSAyNCAxNmwtNC41IDYuNSIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjIuMiIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIi8+IDxjaXJjbGUgY3g9IjE2IiBjeT0iMTYiIHI9IjIiIGZpbGw9IiNmZmYiLz4gPC9zdmc+"
    />

    <!--
      ===========================================================================
      防闪白（FOUC）脚本

      必须满足三个条件，缺一个就会在刷新时闪一下白屏：
        1. 放在 <head> 里，且在任何 <link rel="stylesheet"> 之前
        2. 是普通 <script>，不能加 type="module"
           （module 脚本默认是 defer 的，会等到 HTML 解析完才执行，那时已经画完一帧了）
        3. 逻辑与 src/composables/useTheme.js 完全一致

      ⚠️ 两处共享同一个 localStorage key 'aitw:theme' 和同一套三态语义
         （'auto' | 'light' | 'dark'）。
         改这里就必须同步改 useTheme.js，反之亦然。
      ===========================================================================
    -->
    <script>
      ;(function () {
        var KEY = 'aitw:theme'
        var mode
        try {
          mode = localStorage.getItem(KEY)
        } catch (e) {
          // Safari 无痕模式下 localStorage 会直接抛异常
          mode = null
        }
        if (mode !== 'light' && mode !== 'dark' && mode !== 'auto') mode = 'auto'

        var resolved =
          mode === 'auto'
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : mode

        document.documentElement.setAttribute('data-theme', resolved)
        document.documentElement.setAttribute('data-theme-mode', mode)
      })()
    </script>

    <title>AIToolsWeb · 开发者工具箱</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
